[workspace]
resolver = "2"
members = [
  "crates/synapsevm-core",
  "crates/synapsevm-wasm",
  "crates/synapsevm-types",
  "crates/synapsevm-merkle",
  "crates/synapsevm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SynapseVM"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
