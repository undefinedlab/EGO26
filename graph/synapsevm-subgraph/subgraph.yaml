specVersion: "1.0.0"
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: NeuroRegistry
    network: sepolia
    source:
      address: "0x89913aea6c8fe467e68921aba4270e692999ff9e"
      abi: NeuroRegistry
      startBlock: 11684923
    mapping:
      kind: ethereum/events
      apiVersion: "0.0.7"
      language: wasm/assemblyscript
      entities:
        - NeuroBlock
        - NeuroStack
        - NeuroStackBlock
        - Validation
        - ReceiptBatch
      abis:
        - name: NeuroRegistry
          file: ./abis/NeuroRegistry.json
      eventHandlers:
        - event: NeuroBlockRegistered(indexed bytes32,indexed address,string)
          handler: handleNeuroBlockRegistered
        - event: NeuroStackRegistered(indexed bytes32,indexed address,string)
          handler: handleNeuroStackRegistered
        - event: NeuroBlockDeactivated(indexed bytes32)
          handler: handleNeuroBlockDeactivated
        - event: ValidationRecorded(indexed bytes32,indexed bytes32,indexed bytes32,uint8,string)
          handler: handleValidationRecorded
      file: ./src/neuro-registry.ts
