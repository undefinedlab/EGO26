type NeuroBlock @entity(immutable: false) {
  id: Bytes!
  blockRoot: Bytes!
  manifestURI: String!
  publisher: Bytes!
  createdAt: BigInt!
  active: Boolean!
  name: String!
  version: String!
  organism: String!
  sourceDataset: String!
  neuronCount: Int!
  synapseCount: Int!
}

type NeuroStack @entity(immutable: false) {
  id: Bytes!
  stackRoot: Bytes!
  manifestURI: String!
  publisher: Bytes!
  createdAt: BigInt!
  active: Boolean!
  name: String!
  version: String!
  blocks: [NeuroStackBlock!]! @derivedFrom(field: "stack")
}

type NeuroStackBlock @entity(immutable: true) {
  id: ID!
  stack: NeuroStack!
  blockRoot: Bytes!
  nodeId: String!
}

type Validation @entity(immutable: true) {
  id: Bytes!
  requestHash: Bytes!
  receiptRoot: Bytes!
  blockRoot: Bytes!
  validator: Bytes!
  score: Int!
  tag: String
  evidenceURI: String!
  timestamp: BigInt!
  txHash: Bytes!
}

type ReceiptBatch @entity(immutable: false) {
  id: Bytes!
  deviceId: String!
  firstSequence: BigInt!
  lastSequence: BigInt!
  receiptRoot: Bytes!
  validation: Validation
}
